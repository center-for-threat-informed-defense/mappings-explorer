name: Build Website

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write
  pull-requests: write

jobs:
  build_preview:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      LOGURU_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Add Poetry to PATH
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install

      - name: Build Web Site
        run: poetry run build-mappings-explorer --url-prefix 'https://mappingsexplorer.z13.web.core.windows.net/${{ env.BRANCH_NAME }}/'

      - name: Export Download Artifacts
        run: poetry run mapex export ${GITHUB_WORKSPACE}/mappings ${GITHUB_WORKSPACE}/output/data

      - name: Compress Artifacts
        run: zip -rq output.zip output/

      - name: Upload Web Site
        uses: actions/upload-artifact@v4
        with:
          name: mapex-web-preview
          path: output.zip

      - name: Collect Error Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-preview
          path: /home/runner/work/**/*.log
          if-no-files-found: ignore

  azure_blob:
    if: github.ref_name != 'main'
    needs: build_preview
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_ACCOUNT: mappingsexplorer
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      STATICRYPT_PASS: ${{ secrets.STATICRYPT_PASS }}
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: "18"

      - run: npm install -g staticrypt@3.4.0

      - name: Show tool versions
        run: |
          node --version
          npm --version
          staticrypt --version || true

      - name: Download Web Site
        uses: actions/download-artifact@v4
        with:
          name: mapex-web-preview
          path: .

      - name: Decompress Artifacts
        run: unzip -q output.zip

      - name: Inspect raw output tree
        run: |
          echo "Overall size:"
          du -sh output || true
          echo
          echo "Directory count:"
          find output -type d | wc -l || true
          echo "File count:"
          find output -type f | wc -l || true
          echo "HTML file count:"
          find output -type f -name '*.html' | wc -l || true
          echo
          echo "Largest HTML files:"
          find output -type f -name '*.html' -printf '%s\t%p\n' | sort -nr | head -20 || true

      - name: Prepare HTML-only tree for encryption
        run: |
          rm -rf output-html encrypted
          mkdir -p output-html

          find output -type f -name '*.html' -print0 | while IFS= read -r -d '' file; do
            rel="${file#output/}"
            mkdir -p "output-html/$(dirname "$rel")"
            cp "$file" "output-html/$rel"
          done

      - name: Inspect HTML-only tree
        run: |
          echo "output-html size:"
          du -sh output-html || true
          echo
          echo "output-html directory count:"
          find output-html -type d | wc -l || true
          echo "output-html empty directory count:"
          find output-html -type d -empty | wc -l || true
          echo "output-html file count:"
          find output-html -type f | wc -l || true
          echo "output-html HTML count:"
          find output-html -type f -name '*.html' | wc -l || true
          echo
          echo "Largest HTML files in output-html:"
          find output-html -type f -name '*.html' -printf '%s\t%p\n' | sort -nr | head -20 || true

      - name: Run Staticrypt on HTML-only tree
        env:
          STATICRYPT_PASS: ${{ secrets.STATICRYPT_PASS }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          staticrypt -r output-html/ \
            --remember 30 \
            --salt c0c22fdf0cd9d2a099db9c90ca4a58bf \
            --password "$STATICRYPT_PASS" \
            --short \
            --template-title "Mappings Explorer (branch: '${{ env.BRANCH_NAME }}')" \
            --template-instructions "The contents of this site are marked TLP:AMBER:CTID-R&D:22-80. Do not share with unauthorized individuals." \
            --template-color-primary "#6241c5" \
            --template-color-secondary "#b2b2b2" \
            --template-button "Log In"

      - name: Verify Staticrypt output
        run: |
          test -d encrypted/output-html
          echo "Encrypted HTML count:"
          find encrypted/output-html -type f -name '*.html' | wc -l

      - name: Copy encrypted HTML files into output
        run: rsync -Ir encrypted/output-html/ output/

      - name: Set the branch name
        run: mv output ${{ env.BRANCH_NAME }}

      - name: Install Azure CLI
        run: pip install azure-cli==2.76.0

      - name: Delete old blobs
        run: az storage blob delete-batch -s '$web' --pattern '${{ env.BRANCH_NAME }}/*'

      - name: Upload to blob storage
        run: az storage blob upload-batch -s . --pattern '${{ env.BRANCH_NAME }}/*' -d '$web'

      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `This PR has been published to https://mappingsexplorer.z13.web.core.windows.net/${process.env['BRANCH_NAME']}/`,
            })

      - name: Collect Error Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-azure-blob
          path: /home/runner/work/**/*.log
          if-no-files-found: ignore
