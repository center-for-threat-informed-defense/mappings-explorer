name: Build Website

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write
  pull-requests: write

jobs:
  build_preview:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      LOGURU_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"

      - name: Add Poetry to PATH
        shell: bash
        run: echo "$HOME/.poetry/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          poetry install

      - name: Build Web Site
        shell: bash
        run: |
          set -euo pipefail
          poetry run build-mappings-explorer --url-prefix "https://mappingsexplorer.z13.web.core.windows.net/${BRANCH_NAME}/"

      - name: Export Download Artifacts
        shell: bash
        run: |
          set -euo pipefail
          poetry run mapex export "${GITHUB_WORKSPACE}/mappings" "${GITHUB_WORKSPACE}/output/data"

      - name: Compress Artifacts
        shell: bash
        run: |
          set -euo pipefail
          zip -rq output.zip output/

      - name: Upload Web Site
        uses: actions/upload-artifact@v4
        with:
          name: mapex-web-preview
          path: output.zip

      - name: Collect Error Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-preview
          path: /home/runner/work/**/*.log
          if-no-files-found: ignore

  azure_blob:
    needs: build_preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_ACCOUNT: mappingsexplorer
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      STATICRYPT_PASS: ${{ secrets.STATICRYPT_PASS }}
      PREVIEW_MAX_HTML_BYTES: "50000000"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Staticrypt
        shell: bash
        run: |
          set -euo pipefail
          npm install -g staticrypt@3.4.0

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          staticrypt --version || true

      - name: Download Web Site
        uses: actions/download-artifact@v4
        with:
          name: mapex-web-preview
          path: .

      - name: Decompress Artifacts
        shell: bash
        run: |
          set -euo pipefail
          unzip -q output.zip

      - name: Inspect raw output tree
        shell: bash
        run: |
          set -euo pipefail
          echo "Overall size:"
          du -sh output || true
          echo
          echo "Directory count:"
          find output -type d | wc -l || true
          echo "File count:"
          find output -type f | wc -l || true
          echo "HTML file count:"
          find output -type f -name '*.html' | wc -l || true
          echo
          echo "Largest HTML files:"
          find output -type f -name '*.html' -printf '%s\t%p\n' | sort -nr | head -20 || true

      - name: Prepare HTML-only tree for encryption
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output-html encrypted-html skipped-html.txt
          mkdir -p output-html encrypted-html
          : > skipped-html.txt

          while IFS= read -r -d '' file; do
            rel="${file#output/}"
            size="$(stat -c%s "$file")"
            mkdir -p "output-html/$(dirname "$rel")"

            if [ "$size" -gt "$PREVIEW_MAX_HTML_BYTES" ]; then
              printf '%s\t%s\n' "$size" "$rel" | tee -a skipped-html.txt
              cat > "output-html/$rel" <<EOF
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preview omitted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Preview omitted for oversized page</h1>
  <p>This PR preview omits this page because the generated HTML is too large for Staticrypt to process reliably in GitHub Actions.</p>
  <p><strong>Path:</strong> <code>$rel</code></p>
  <p><strong>Size:</strong> $size bytes</p>
  <p>If this page must be protected in preview, the underlying site generator should be changed to split or shrink the HTML, or the preview site should be protected at Azure instead of with Staticrypt.</p>
</body>
</html>
EOF
            else
              cp "$file" "output-html/$rel"
            fi
          done < <(find output -type f -name '*.html' -print0)

      - name: Inspect HTML-only tree
        shell: bash
        run: |
          set -euo pipefail
          echo "output-html size:"
          du -sh output-html || true
          echo
          echo "output-html directory count:"
          find output-html -type d | wc -l || true
          echo "output-html file count:"
          find output-html -type f | wc -l || true
          echo "output-html HTML count:"
          find output-html -type f -name '*.html' | wc -l || true
          echo
          echo "Largest HTML files in output-html:"
          find output-html -type f -name '*.html' -printf '%s\t%p\n' | sort -nr | head -20 || true
          echo
          echo "Skipped oversized HTML files:"
          if [ -s skipped-html.txt ]; then
            cat skipped-html.txt
          else
            echo "None"
          fi

      - name: Upload skipped HTML manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skipped-html-manifest
          path: skipped-html.txt
          if-no-files-found: ignore

      - name: Encrypt HTML files one at a time
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          STATICRYPT_PASS: ${{ secrets.STATICRYPT_PASS }}
        run: |
          set -euo pipefail

          count=0
          while IFS= read -r -d '' file; do
            rel="${file#output-html/}"
            count=$((count + 1))
            echo "[$count] Encrypting $rel"

            tmpdir="$(mktemp -d)"
            mkdir -p "$tmpdir/in/$(dirname "$rel")"
            cp "$file" "$tmpdir/in/$rel"

            (
              cd "$tmpdir"
              staticrypt -r in \
                --remember 30 \
                --salt c0c22fdf0cd9d2a099db9c90ca4a58bf \
                --password "$STATICRYPT_PASS" \
                --short \
                --template-title "Mappings Explorer (branch: '${BRANCH_NAME}')" \
                --template-instructions "The contents of this site are marked TLP:AMBER:CTID-R&D:22-80. Do not share with unauthorized individuals." \
                --template-color-primary "#6241c5" \
                --template-color-secondary "#b2b2b2" \
                --template-button "Log In"
            )

            test -f "$tmpdir/encrypted/in/$rel"
            mkdir -p "encrypted-html/$(dirname "$rel")"
            cp "$tmpdir/encrypted/in/$rel" "encrypted-html/$rel"
            rm -rf "$tmpdir"
          done < <(find output-html -type f -name '*.html' -print0)

      - name: Inspect encrypted HTML tree
        shell: bash
        run: |
          set -euo pipefail
          echo "encrypted-html size:"
          du -sh encrypted-html || true
          echo
          echo "encrypted-html file count:"
          find encrypted-html -type f -name '*.html' | wc -l || true

      - name: Overlay encrypted HTML files back into output
        shell: bash
        run: |
          set -euo pipefail
          rsync -Ir encrypted-html/ output/

      - name: Set the branch name
        shell: bash
        run: |
          set -euo pipefail
          mv output "${BRANCH_NAME}"

      - name: Install Azure CLI
        shell: bash
        run: |
          set -euo pipefail
          pip install azure-cli==2.76.0

      - name: Delete old blobs
        shell: bash
        run: |
          set -euo pipefail
          az storage blob delete-batch -s '$web' --pattern "${BRANCH_NAME}/*"

      - name: Upload to blob storage
        shell: bash
        run: |
          set -euo pipefail
          az storage blob upload-batch -s . --pattern "${BRANCH_NAME}/*" -d '$web'

      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `This PR has been published to https://mappingsexplorer.z13.web.core.windows.net/${process.env.BRANCH_NAME}/`,
            })

      - name: Collect Error Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-azure-blob
          path: /home/runner/work/**/*.log
          if-no-files-found: ignore
