name: Build Website

on:
  push:
    branches: [main]

# Do not interrupt an in-progress production synchronization.
concurrency:
  group: mappings-explorer-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web_site:
    runs-on: ubuntu-latest
    env:
      LOGURU_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
            version: 1.8.5
      - name: Add Poetry to PATH
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install
      - name: Build Web Site
        run: poetry run build-mappings-explorer --url-prefix 'https://ctid.mitre.org/mappings/'
      - name: Export Download Artifacts
        run: poetry run mapex export ${GITHUB_WORKSPACE}/mappings ${GITHUB_WORKSPACE}/output/data
      - name: Verify Web Site
        run: |
          test -s output/index.html
          test -s output/404.html
          test -s output/search/index.html
          test -s output/static/main.css
          test -s output/static/lunr-index.zip
          compgen -G 'output/data/attack/enterprise-attack-*.json' > /dev/null
          grep -Fq 'https://ctid.mitre.org/mappings/static/main.css' output/index.html
      - name: Compress Artifacts
        run: zip -rq output.zip output/
      - name: Upload Web Site
        uses: actions/upload-artifact@v4
        with:
          name: mapex-web
          path: output.zip
          retention-days: 1
      - name: Collect Error Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: /home/runner/work/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  deploy_azure:
    needs: web_site
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.AZURE_STATIC_WEBSITE_ENDPOINT }}
    steps:
      - name: Download Web Site
        uses: actions/download-artifact@v4
        with:
          name: mapex-web
          path: .
      - name: Decompress Web Site
        run: unzip -q output.zip
      - name: Verify Deployment Source
        run: |
          test -s output/index.html
          test -s output/404.html
          test -s output/static/main.css
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Synchronize Static Website
        run: |
          az storage blob sync \
            --account-name '${{ vars.AZURE_STORAGE_ACCOUNT }}' \
            --container '$web' \
            --source output \
            --auth-mode login \
            --delete-destination true \
            --only-show-errors
      - name: Verify Static Website
        run: |
          endpoint='${{ vars.AZURE_STATIC_WEBSITE_ENDPOINT }}'
          endpoint="${endpoint%/}"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            "$endpoint/static/main.css" > /dev/null
          status=$(curl --silent --show-error --output /tmp/mapex-404.html \
            --write-out '%{http_code}' "$endpoint/not-a-real-page")
          test "$status" = '404'
          grep -Fq 'Page Not Found' /tmp/mapex-404.html
