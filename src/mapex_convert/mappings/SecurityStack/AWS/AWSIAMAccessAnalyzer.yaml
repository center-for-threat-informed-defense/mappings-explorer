name: AWS IAM Access Analyzer
contact: ctid@mitre.org
organization: Center for Threat Informed Defense (CTID)
platform: AWS
tags:
  - Identity
description: >-
  AWS Identity and Access Management (IAM) Access Analyzer helps you identify the resources in your organization and accounts, such as Amazon S3 buckets or IAM roles, shared with an external entity. This lets you identify unintended access to your resources and data, which is a security risk. IAM Access Analyzer also provides policy generation which provides options to employ policy for IAM entities (users or roles) to help you refine the permissions that you grant.
